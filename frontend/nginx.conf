# Use this with nginx when deploying the SPA (e.g. Docker/Cloud Run).
# Ensures refresh or direct URLs like /dash return index.html instead of 404.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
